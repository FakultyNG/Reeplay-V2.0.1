buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        // Cast 23.0.0 pulls MediaRouter 1.9.0-beta01, which requires
        // compileSdk 37 and AGP 9.1. Keep the sender SDK on the latest
        // compatible 22.x patch while this app builds with SDK 36 / AGP 8.12.
        castFrameworkVersion = "22.3.1"

        useExoplayerIMA = true
    // useExoplayerRtsp = true
    // useExoplayerSmoothStreaming = true
    // useExoplayerDash = true
    useExoplayerHls = true

        // Pin exact versions — inappbrowser-reborn defaults to dynamic "1.5.+" / "1.4.+"
        // which require online maven-metadata resolution and fail on flaky DNS.
        androidXAnnotation = "1.9.1"
        androidXBrowser = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
        
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
         classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.6")
    }
}

allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven {
            url "$rootDir/../node_modules/react-native-video-cache/android/libs"
        }
    }
    configurations.configureEach {
        resolutionStrategy {
            force "com.google.android.gms:play-services-cast-framework:${rootProject.ext.castFrameworkVersion}"
            force "com.google.android.gms:play-services-cast:${rootProject.ext.castFrameworkVersion}"
            force "androidx.annotation:annotation:1.9.1"
            force "androidx.annotation:annotation-jvm:1.9.1"
            force "androidx.browser:browser:1.8.0"
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
