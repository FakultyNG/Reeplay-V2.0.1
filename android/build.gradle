buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 35
        ndkVersion = "26.1.10909125"
        kotlinVersion = "2.0.0"

        useExoplayerIMA = true
    // useExoplayerRtsp = true
    // useExoplayerSmoothStreaming = true
    // useExoplayerDash = true
    useExoplayerHls = true
    }
    repositories {
        google()
        mavenCentral()
        
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.2")
         classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.6")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "$rootDir/../node_modules/react-native-video-cache/android/libs"
        }
    }
    configurations.all {
        resolutionStrategy {
            force "com.google.android.gms:play-services-cast-framework:21.4.0"
            force "com.google.android.gms:play-services-cast:21.4.0"
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
